            maxTokens: 128000
          - id: group/model-ds41-flash
            name: DS4.1 Flash · routing group
            contextWindow: 1000000
            maxTokens: 128000
          - id: group/model-kimi31-pro
            name: Kimi 3.1 · routing group
            contextWindow: 1000000
